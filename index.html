<!DOCTYPE html>
<html lang="en">
<head>
    <title>Formulir pendaftaran</title>

    <style>
        .form-group {
            margin-bottom: 10px;
        }

        label{
            display: inline-block;
            width: 120px;
        }
        
    </style>
</head>
<body>

    <div class="container"> 

    <h1>Formulir Pendaftaran</h1>

    <form>

    <div class="form-group">
        <label>Nama</label> :
        <input type="text">
    </div>

    <div class="form-group">
        <label>Alamat</label> :
        <input type="text">
    </div>

    <div class="form-group">
        <label>Kota</label> :
        <input type="text">
    </div>

    <div class="form-group">
        <label>Telp</label> :
        <input type="text">
    </div>  

    <div class="form-group">
    <label>Jenis Kelamin</label> :
        <input type="radio" name="jk"> Laki-laki
        <input type="radio" name="jk"> Perempuan
    </div>

    <div class="form-group">
    <label>Hobi</label> :
        <input type="checkbox" name="hobi"> Berenang
        <input type="checkbox" name="hobi"> Membaca
        <input type="checkbox" name="hobi"> Mendengar Musik
    </div>

    <div class="form-group">
    <label>Agama</label> :
        <select>
            <option>Islam</option>
            <option>Kristen</option>
            <option>Hindu</option>
            <option>Budha</option>
        </select>
    </div>

    <div class="form-group">
        <label>Asal Sekolah</label> :
        <input type="text">
    </div>
 
    <div class="form-group">
        <label>Jurusan</label> :
        <input type="text">
    </div>

    <button type="submit">Kirim</button>
    <button type="reset">Reset</button>


    </form>

    </div>
       
</body>
</html>
