<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Tebak Warna</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
    }

    body{
        background:linear-gradient(135deg,#1e1e2f,#252547);
        color:white;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
    }

    .container{
        width:400px;
        background:#2f2f4f;
        padding:30px;
        border-radius:20px;
        text-align:center;
        box-shadow:0 0 20px rgba(0,0,0,0.5);
    }

    h1{
        margin-bottom:20px;
    }

    .color-box{
        width:200px;
        height:200px;
        margin:20px auto;
        border-radius:20px;
        border:5px solid white;
    }

    .buttons{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:10px;
        margin-top:20px;
    }

    button{
        padding:12px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        font-size:16px;
        font-weight:bold;
        transition:0.3s;
    }

    button:hover{
        transform:scale(1.05);
    }

    .score{
        margin-top:20px;
        font-size:20px;
    }

    .message{
        margin-top:15px;
        font-size:18px;
        font-weight:bold;
    }

</style>
</head>
<body>

<div class="container">
    <h1>🎨 Tebak Warna</h1>

    <p>Pilih nama warna yang benar!</p>

    <div class="color-box" id="colorBox"></div>

    <div class="buttons" id="buttons"></div>

    <div class="message" id="message"></div>

    <div class="score">
        Score: <span id="score">0</span>
    </div>
</div>

<script>

const colors = [
    {name:"Merah", code:"red"},
    {name:"Biru", code:"blue"},
    {name:"Hijau", code:"green"},
    {name:"Kuning", code:"yellow"},
    {name:"Ungu", code:"purple"},
    {name:"Orange", code:"orange"},
    {name:"Pink", code:"pink"},
    {name:"Coklat", code:"brown"}
];

let score = 0;
let correctAnswer = "";

function startGame(){

    const randomColor = colors[Math.floor(Math.random()*colors.length)];

    correctAnswer = randomColor.name;

    document.getElementById("colorBox").style.background = randomColor.code;

    let options = [correctAnswer];

    while(options.length < 4){
        let randomOption = colors[Math.floor(Math.random()*colors.length)].name;

        if(!options.includes(randomOption)){
            options.push(randomOption);
        }
    }

    options.sort(()=>Math.random()-0.5);

    const buttonsDiv = document.getElementById("buttons");
    buttonsDiv.innerHTML = "";

    options.forEach(option => {

        const btn = document.createElement("button");

        btn.innerText = option;

        btn.onclick = function(){

            if(option === correctAnswer){
                score++;
                document.getElementById("message").innerHTML = "✅ Benar!";
            }else{
                document.getElementById("message").innerHTML = "❌ Salah!";
            }

            document.getElementById("score").innerText = score;

            setTimeout(startGame,1000);
        }

        buttonsDiv.appendChild(btn);
    });

}

startGame();

</script>

</body>
</html>
